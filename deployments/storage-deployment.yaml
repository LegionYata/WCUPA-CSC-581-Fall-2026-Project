apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
  labels:
    app: storage
    project: csc581-pipeline
spec:
  replicas: 1   # single replica: emptyDir is per-Pod, so data is NOT shared or persistent (PVC in Milestone 3)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
        project: csc581-pipeline
    spec:
      containers:
        - name: storage
          image: python:3.11-slim
          command: ["python", "-u", "/app/storage.py"]
          ports:
            - containerPort: 8083
          env:
            - name: SERVICE_NAME
              value: storage
            - name: PORT
              value: "8083"
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /healthz, port: 8083 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8083 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: app-code
          configMap:
            name: pipeline-code
        - name: data
          emptyDir: {}   # ephemeral: wiped whenever the Pod is deleted
